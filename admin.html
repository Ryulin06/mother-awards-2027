<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>模範母親｜工作人員後台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<style>
:root{--bg:#f7f5f4;--card:#fff;--line:#e4dcda;--ink:#423633;--muted:#837572;--accent:#8e5549}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:var(--ink)}.wrap{max-width:980px;margin:auto;padding:24px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}input,button{font:inherit}input[type=email],input[type=password],input[type=text]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px}.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--accent);color:white;font-weight:700;cursor:pointer}.ghost{background:white;color:var(--ink);border:1px solid var(--line)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hidden{display:none}.muted{color:var(--muted);font-size:13px}.item{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0}.item .grow{flex:1;min-width:0}.wish{padding:10px 0;border-top:1px solid var(--line)}h1{margin-top:0}.danger{background:#8a3f3f}
</style>
</head><body><div class="wrap"><h1>工作人員後台</h1><section id="login" class="card"><h2>管理員登入</h2><p class="muted">使用 Supabase Auth 已建立的管理員帳號登入。</p><form id="loginForm"><div class="row"><input id="email" type="email" placeholder="Email" required /><input id="password" type="password" placeholder="密碼" required /><button class="btn">登入</button></div></form><p id="loginMsg" class="muted"></p></section>
<div id="panel" class="hidden"><section class="card"><div class="row"><div class="grow"><h2>影片播放清單</h2><p class="muted">影片會上傳到 Supabase Storage，現場 screen.html 會自動更新。</p></div><button id="logout" class="btn ghost">登出</button></div><input id="files" type="file" accept="video/mp4,video/webm,video/quicktime" multiple /><div id="uploadMsg" class="muted" style="margin-top:8px"></div><div id="videos"></div></section><section class="card"><h2>祝福留言管理</h2><p class="muted">可隱藏不適合出現在現場大螢幕的留言，也可永久刪除留言。</p><div id="wishes"></div></section></div></div>
<script>
const client=supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_KEY);const $=s=>document.querySelector(s);let awards={};function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function refreshSession(){const {data:{session}}=await client.auth.getSession();$('#login').classList.toggle('hidden',!!session);$('#panel').classList.toggle('hidden',!session);if(session){loadVideos();loadWishes()}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginMsg').textContent='登入中…';const {error}=await client.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});$('#loginMsg').textContent=error?'登入失敗：'+error.message:'';if(!error)refreshSession()};$('#logout').onclick=async()=>{await client.auth.signOut();refreshSession()};
$('#files').onchange=async e=>{const files=[...e.target.files];if(!files.length)return;$('#uploadMsg').textContent='上傳中…';for(const f of files){const safe=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2))+'.'+(f.name.split('.').pop()||'mp4').toLowerCase();const {error:uerr}=await client.storage.from('event-videos').upload(safe,f,{contentType:f.type,upsert:false});if(uerr){$('#uploadMsg').textContent='上傳失敗：'+uerr.message;return}const {data:maxrow}=await client.from('videos').select('sort_order').order('sort_order',{ascending:false}).limit(1).maybeSingle();const {error:derr}=await client.from('videos').insert({title:f.name,file_path:safe,sort_order:(maxrow?.sort_order||0)+1});if(derr){$('#uploadMsg').textContent='建立播放項目失敗：'+derr.message;return}}$('#uploadMsg').textContent='上傳完成';e.target.value='';loadVideos()};
async function loadVideos(){const {data}=await client.from('videos').select('*').order('sort_order');$('#videos').innerHTML=(data||[]).map(v=>`<div class="item"><div class="grow"><strong>${esc(v.title)}</strong><div class="muted">順序 ${v.sort_order}・${v.active?'播放中':'已停用'}</div></div><button class="btn ghost toggle" data-id="${v.id}" data-active="${v.active}">${v.active?'停用':'啟用'}</button><button class="btn danger del" data-id="${v.id}" data-path="${esc(v.file_path)}">刪除</button></div>`).join('')||'<p class="muted">尚無影片</p>';document.querySelectorAll('.toggle').forEach(b=>b.onclick=async()=>{await client.from('videos').update({active:b.dataset.active!=='true'}).eq('id',b.dataset.id);loadVideos()});document.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{if(!confirm('確定刪除此影片？'))return;await client.storage.from('event-videos').remove([b.dataset.path]);await client.from('videos').delete().eq('id',b.dataset.id);loadVideos()})}
async function loadWishes(){
  if(!Object.keys(awards).length){
    const {data:a,error:aerr}=await client.from('awards').select('id,name');
    if(aerr){$('#wishes').innerHTML='<p class="muted">讀取獲獎者失敗：'+esc(aerr.message)+'</p>';return}
    awards=Object.fromEntries((a||[]).map(x=>[x.id,x.name]));
  }
  const {data,error}=await client.from('wishes').select('*').order('created_at',{ascending:false}).limit(100);
  if(error){$('#wishes').innerHTML='<p class="muted">讀取留言失敗：'+esc(error.message)+'</p>';return}
  $('#wishes').innerHTML=(data||[]).map(w=>`<div class="wish"><div><strong>${esc(awards[w.award_id]||'')}媽媽</strong>：「${esc(w.message)}」</div><div class="row" style="margin-top:7px"><span class="muted">${new Date(w.created_at).toLocaleString()}・${w.is_visible?'顯示中':'已隱藏'}</span><button class="btn ghost hide" data-id="${w.id}" data-visible="${w.is_visible}">${w.is_visible?'隱藏':'恢復顯示'}</button><button class="btn danger delete-wish" data-id="${w.id}">刪除</button></div></div>`).join('')||'<p class="muted">尚無留言</p>';
  document.querySelectorAll('.hide').forEach(b=>b.onclick=async()=>{
    const original=b.textContent;
    b.disabled=true;b.textContent='處理中…';
    const next=b.dataset.visible!=='true';
    const {error}=await client.from('wishes').update({is_visible:next}).eq('id',b.dataset.id);
    if(error){alert('更新留言失敗：'+error.message);b.disabled=false;b.textContent=original;return}
    await loadWishes();
  });
  document.querySelectorAll('.delete-wish').forEach(b=>b.onclick=async()=>{
    if(!confirm('確定永久刪除此留言？刪除後無法復原。'))return;
    const original=b.textContent;
    b.disabled=true;b.textContent='刪除中…';
    const {error}=await client.from('wishes').delete().eq('id',b.dataset.id);
    if(error){alert('刪除留言失敗：'+error.message);b.disabled=false;b.textContent=original;return}
    await loadWishes();
  });
}
client.auth.onAuthStateChange(()=>refreshSession());refreshSession();
</script></body></html>
