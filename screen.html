<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>模範母親｜現場大螢幕</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#101010;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;overflow:hidden}
.stage{height:100vh;display:flex;flex-direction:column;background:#111}
.video{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden;background:#000}
.video video{width:100%;height:100%;object-fit:contain;background:#000}
.hidden{display:none!important}
.empty{text-align:center;color:#d0d0d0;font-size:24px;padding:24px}

/* 多列跑馬燈：不同留言可同時出現，位置上下交錯 */
.ticker-layer{position:absolute;inset:0;z-index:25;pointer-events:none;overflow:hidden}
.ticker-lane{position:absolute;left:0;right:0;height:62px;overflow:hidden}
.ticker-lane:nth-child(1){top:7%}
.ticker-lane:nth-child(2){top:18%}
.ticker-lane:nth-child(3){top:30%}
.ticker-lane:nth-child(4){bottom:31%}
.ticker-lane:nth-child(5){bottom:20%}
.ticker-msg{position:absolute;left:0;top:50%;transform:translateY(-50%);visibility:hidden;white-space:nowrap;font-weight:900;font-size:clamp(24px,2.15vw,43px);line-height:1.2;letter-spacing:.02em;color:#fff;will-change:transform;text-shadow:-2px -2px 0 rgba(0,0,0,.92),2px -2px 0 rgba(0,0,0,.92),-2px 2px 0 rgba(0,0,0,.92),2px 2px 0 rgba(0,0,0,.92),0 5px 14px rgba(0,0,0,.88)}
.ticker-msg .name{color:#ffd36f}
.ticker-msg .sender{color:#fff1b8}

/* 一則顯示中的留言 = 一朵花，稍微重疊形成花園 */
.flower-garden{position:absolute;left:0;right:0;bottom:0;z-index:35;min-height:145px;padding:6px 16px 10px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.15) 20%,rgba(31,24,20,.78));pointer-events:none}
.flower-label{align-self:flex-end;margin:0 8px 5px 0;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.13);backdrop-filter:blur(5px);font-size:13px}
.flowers{position:relative;display:flex;flex-wrap:wrap-reverse;align-content:flex-end;align-items:flex-end;justify-content:center;min-height:103px;padding:0 3vw;gap:0;overflow:hidden}
.flowers:before{content:"";position:absolute;left:3%;right:3%;bottom:-5px;height:45px;background:linear-gradient(180deg,rgba(92,123,75,.15),rgba(47,75,43,.66));border-radius:55% 55% 0 0/100% 100% 0 0}
.bloom{position:relative;flex:0 0 auto;width:clamp(34px,3vw,58px);height:clamp(34px,3vw,58px);display:flex;align-items:flex-end;justify-content:center;margin-left:clamp(-14px,-.8vw,-7px);margin-top:clamp(-11px,-.65vw,-5px);font-size:clamp(28px,2.6vw,49px);line-height:1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45));animation:bloomIn .38s ease both}
.bloom:nth-child(5n+1){transform:translateY(9px) rotate(-6deg)}
.bloom:nth-child(5n+2){transform:translateY(2px) rotate(4deg)}
.bloom:nth-child(5n+3){transform:translateY(12px) rotate(1deg)}
.bloom:nth-child(5n+4){transform:translateY(5px) rotate(-3deg)}
.bloom:nth-child(5n){transform:translateY(0) rotate(5deg)}
@keyframes bloomIn{from{opacity:0;scale:.55;translate:0 14px}to{opacity:1;scale:var(--s,1);translate:0 0}}

.info-bar{flex:0 0 40px;height:40px;display:flex;align-items:center;justify-content:center;background:#6f4339;color:#fff7f3;font-size:15px;font-weight:700;letter-spacing:.04em}
@media(max-width:800px){
  .ticker-msg{font-size:clamp(18px,4.8vw,30px)}
  .ticker-lane:nth-child(1){top:8%}
  .ticker-lane:nth-child(2){top:20%}
  .ticker-lane:nth-child(3){top:32%}
  .ticker-lane:nth-child(4){bottom:34%}
  .ticker-lane:nth-child(5){bottom:22%}
}
@media(prefers-reduced-motion:reduce){.bloom{animation:none}}
</style>
</head>
<body>
<div class="stage">
<div class="video">
    <div id="empty" class="empty">等待工作人員上傳影片</div>
    <video id="video" class="hidden" autoplay muted playsinline preload="auto"></video>
<div id="videoError" class="empty hidden" style="color:#ffcfbf">影片格式無法播放，建議使用 MP4（H.264 + AAC）。</div>

    <div class="ticker-layer" aria-live="polite">
      <div class="ticker-lane"><div class="ticker-msg"></div></div>
      <div class="ticker-lane"><div class="ticker-msg"></div></div>
      <div class="ticker-lane"><div class="ticker-msg"></div></div>
      <div class="ticker-lane"><div class="ticker-msg"></div></div>
      <div class="ticker-lane"><div class="ticker-msg"></div></div>
    </div>

    <div class="flower-garden">
      <div id="flowerLabel" class="flower-label">0 朵祝福之花</div>
      <div id="flowers" class="flowers"></div>
    </div>
  </div>

  <div class="info-bar">每一則祝福，都會在螢幕上綻放成一朵花</div>
</div>

<script>
const client=supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_KEY);

const video=document.getElementById('video');
const empty=document.getElementById('empty');
const videoError=document.getElementById('videoError');
const flowers=document.getElementById('flowers');
const flowerLabel=document.getElementById('flowerLabel');
const lanes=[...document.querySelectorAll('.ticker-lane')];
const laneMsgs=lanes.map(x=>x.querySelector('.ticker-msg'));

let awards={};
let wishes=[];
let videos=[];
let videoIndex=0;
let desiredSound=true;
let audioUnlocked=false;
let repeatCount=5;

let tickerQueue=[];
let tickerSeq=0;
const activeWishIds=new Set();
const activeAnimations=new Map();

const flowerSet=['🌷','🌸','🌺','🌼','🌹','🪻','🌻','💐','🌿'];

function esc(s=''){
  return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))
}
function formatWish(w){
  const sender=esc(w.sender_name||'匿名');
  const mom=esc(awards[w.award_id]||'');
  return `<span class="sender">${sender}</span> 對 <span class="name">${mom}</span> 媽媽說：「${esc(w.message)}」`;
}
function renderFlowers(){
  const visible=wishes.slice(0,60);
  flowers.innerHTML=visible.map((w,i)=>{
    const z=1+(i%9);
    const scale=(.88+((i%6)*.035)).toFixed(2);
    return `<span class="bloom" style="z-index:${z};--s:${scale}" title="${esc(awards[w.award_id]||'')}">${flowerSet[i%flowerSet.length]}</span>`;
  }).join('');
  flowerLabel.textContent=`${visible.length} 朵祝福之花`;
}

/* 多列跑馬燈：每則新留言總共出現 5 次，同一則不會同時佔兩列 */
function enqueueWishBySetting(w){
  if(!w||w.is_visible===false)return;
  const count=Math.min(20,Math.max(1,Number(repeatCount||5)));
  for(let i=0;i<count;i++)tickerQueue.push({seq:++tickerSeq,wish:w,pass:i+1});
}
function removeWishFromTicker(wishId){
  tickerQueue=tickerQueue.filter(j=>j.wish.id!==wishId);
  const entry=activeAnimations.get(wishId);
  if(entry){try{entry.animation.cancel()}catch(e){}}
}
function takeNextJob(){
  const visibleIds=new Set(wishes.map(w=>w.id));
  for(let i=0;i<tickerQueue.length;i++){
    const job=tickerQueue[i];
    if(!visibleIds.has(job.wish.id)){tickerQueue.splice(i,1);i--;continue}
    if(activeWishIds.has(job.wish.id))continue;
    return tickerQueue.splice(i,1)[0];
  }
  return null;
}
async function runLane(laneIndex){
  const lane=lanes[laneIndex];
  const msg=laneMsgs[laneIndex];

  while(true){
    const job=takeNextJob();
    if(!job){await new Promise(r=>setTimeout(r,160));continue}

    const w=job.wish;
    activeWishIds.add(w.id);
    msg.innerHTML=formatWish(w);
    msg.style.visibility='visible';
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

    const laneWidth=lane.clientWidth;
    const textWidth=Math.ceil(msg.getBoundingClientRect().width);
    const startX=laneWidth+28;
    const endX=-(textWidth+28);
    const distance=startX-endX;
    const duration=Math.max(6500,Math.round(distance/165*1000));

    let animation;
    try{
      animation=msg.animate(
        [{transform:`translate(${startX}px,-50%)`},{transform:`translate(${endX}px,-50%)`}],
        {duration,easing:'linear',fill:'forwards'}
      );
      activeAnimations.set(w.id,{animation,laneIndex});
      await animation.finished;
    }catch(e){
    }finally{
      activeAnimations.delete(w.id);
      activeWishIds.delete(w.id);
      msg.style.visibility='hidden';
      msg.innerHTML='';
    }

    await new Promise(r=>setTimeout(r,240));
  }
}
let workersStarted=false;
function startTickerWorkers(){
  if(workersStarted)return;
  workersStarted=true;
  lanes.forEach((_,i)=>runLane(i));
}


async function loadRepeatSetting(){
  const {data,error}=await client.from('event_settings')
    .select('value_int')
    .eq('key','ticker_repeat_count')
    .maybeSingle();

  if(!error && data){
    repeatCount=Math.min(20,Math.max(1,Number(data.value_int||5)));
  }
}

/* 留言 / 花園 */
async function loadWishes(){
  const [{data:a},{data:w}]=await Promise.all([
    client.from('awards').select('id,name'),
    client.from('wishes').select('id,award_id,sender_name,message,created_at,is_visible').order('created_at',{ascending:false}).limit(100)
  ]);
  awards=Object.fromEntries((a||[]).map(x=>[x.id,x.name]));
  wishes=(w||[]).filter(x=>x.is_visible!==false);
  renderFlowers();
}


async function loadSoundSetting(){
  const {data,error}=await client.from('event_settings')
    .select('value_bool')
    .eq('key','video_sound_enabled')
    .maybeSingle();

  if(!error && data){
    desiredSound=data.value_bool!==false;
    applySoundSetting();
  }
}

async function applySoundSetting(){
  if(!desiredSound){
    video.muted=true;
    return;
  }

  if(audioUnlocked){
    video.removeAttribute('muted');
    video.defaultMuted=false;
    video.muted=false;
    video.volume=1;
    try{ await video.play(); }catch(e){}
  }else{
    video.muted=true;
  }
}

document.addEventListener('click',async()=>{
  if(audioUnlocked)return;
  audioUnlocked=true;
  await applySoundSetting();
},{once:true});

/* 影片 */
async function loadVideos(){
  const {data}=await client.from('videos').select('id,title,file_path,sort_order,active').eq('active',true).order('sort_order');
  videos=data||[];

  if(!videos.length){
    video.pause();video.removeAttribute('src');video.load();
    video.classList.add('hidden');empty.classList.remove('hidden');videoError.classList.add('hidden');
    return;
  }
  videoIndex=Math.min(videoIndex,videos.length-1);
  playVideo(videoIndex);
}

function playVideo(i){
  if(!videos.length)return;
  videoIndex=(i+videos.length)%videos.length;
  const item=videos[videoIndex];
  const {data}=client.storage.from('event-videos').getPublicUrl(item.file_path);

  video.pause();
  video.src=data.publicUrl;
  video.load();
  video.volume=1;
  video.defaultMuted=true;
  video.muted=true;

  video.classList.remove('hidden');
  empty.classList.add('hidden');
  videoError.classList.add('hidden');

  video.play().then(()=>{
    applySoundSetting();
  }).catch(()=>{});

}

video.addEventListener('ended',()=>playVideo(videoIndex+1));
video.addEventListener('error',()=>{
  video.classList.add('hidden');videoError.classList.remove('hidden');
  videoError.textContent='影片載入失敗或編碼不支援。請改用 MP4（H.264 + AAC）。';
});

/* Realtime */
client.channel('screen-wishes')
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'wishes'},payload=>{
    const w=payload.new;
    if(w&&w.is_visible!==false){
      wishes.unshift(w);
      renderFlowers();
      enqueueWishBySetting(w);
    }
  })
  .subscribe();

client.channel('screen-wish-events')
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'wish_events'},async payload=>{
    const ev=payload.new;

    if(ev && ev.action==='replay'){
      let w=wishes.find(x=>x.id===ev.wish_id);

      if(!w){
        const {data,error}=await client.from('wishes')
          .select('id,award_id,sender_name,message,created_at,is_visible')
          .eq('id',ev.wish_id)
          .maybeSingle();

        if(!error && data && data.is_visible!==false){
          w=data;
          if(!wishes.some(x=>x.id===w.id))wishes.unshift(w);
          renderFlowers();
        }
      }

      if(w && w.is_visible!==false){
        enqueueWishBySetting(w);
      }
      return;
    }

    if(ev && (ev.action==='hidden'||ev.action==='deleted')){
      removeWishFromTicker(ev.wish_id);
    }

    await loadWishes();
  })
  .subscribe();

client.channel('screen-settings')
  .on('postgres_changes',{event:'UPDATE',schema:'public',table:'event_settings'},payload=>{
    const row=payload.new;
    if(row?.key==='ticker_repeat_count'){
      const next=Number(row.value_int||5);
      repeatCount=Math.min(20,Math.max(1,next));
    }
    if(row?.key==='video_sound_enabled'){
      desiredSound=row.value_bool!==false;
      applySoundSetting();
    }
  })
  .subscribe();

client.channel('screen-videos')
  .on('postgres_changes',{event:'*',schema:'public',table:'videos'},()=>loadVideos())
  .subscribe();

startTickerWorkers();
loadRepeatSetting();
loadSoundSetting();
loadWishes();
loadVideos();
</script>
</body>
</html>
